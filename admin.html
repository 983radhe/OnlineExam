<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vikas Online Exam - Admin</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 20px;
    }

    .header {
      background: #1e3a8a;
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.85;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      color: #111827;
      font-size: 20px;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .refresh-btn {
      background: #2563eb;
      color: white;
    }

    .refresh-btn:hover {
      background: #1d4ed8;
    }

    .delete-all-btn {
      background: #991b1b;
      color: white;
    }

    .delete-all-btn:hover {
      background: #7f1d1d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th {
      background: #e2e8f0;
      color: #334155;
      padding: 12px;
      text-align: left;
      font-size: 13px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      color: #374151;
      font-size: 13px;
    }

    tr.removing {
      opacity: 0.4;
      transition: opacity 0.2s ease;
    }

    .pending {
      color: #92400e;
      background: #fef3c7;
      padding: 5px 9px;
      border-radius: 15px;
      font-weight: bold;
    }

    .approved {
      color: #166534;
      background: #dcfce7;
      padding: 5px 9px;
      border-radius: 15px;
      font-weight: bold;
    }

    .rejected {
      color: #991b1b;
      background: #fee2e2;
      padding: 5px 9px;
      border-radius: 15px;
      font-weight: bold;
    }

    .approve-btn {
      background: #16a34a;
      color: white;
      margin-right: 5px;
    }

    .reject-btn {
      background: #dc2626;
      color: white;
      margin-right: 5px;
    }

    .copy-btn {
      background: #475569;
      color: white;
      margin-right: 5px;
    }

    .regenerate-btn {
      background: #f59e0b;
      color: white;
      margin-right: 5px;
    }

    .delete-btn {
      background: #b91c1c;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    .code {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #111827;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

  </style>

</head>


<body>

  <div class="header">

    <h1>Vikas Online Exam</h1>

    <p>Administrator Panel</p>

  </div>


  <div class="card">

    <div class="top-bar">

      <h2>Verification Requests</h2>

      <div class="button-group">

        <button
          class="refresh-btn"
          type="button"
          onclick="loadRequests()"
        >
          Refresh
        </button>

        <button
          class="delete-all-btn"
          type="button"
          onclick="deleteAllRequests()"
        >
          Delete All
        </button>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div id="requestContainer">

      <div class="loading">
        Loading requests...
      </div>

    </div>

  </div>


  <script>

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.textContent = text;

      box.className =
        "message " + type;

      setTimeout(function() {

        box.className = "message";

      }, 3000);

    }


    function loadRequests() {

      const container =
        document.getElementById("requestContainer");

      container.innerHTML =
        '<div class="loading">Loading requests...</div>';


      google.script.run

        .withSuccessHandler(function(result) {

          if (!result.success) {

            container.innerHTML =
              '<div class="empty">' +
              result.message +
              '</div>';

            return;
          }


          if (!result.requests ||
              result.requests.length === 0) {

            container.innerHTML =
              '<div class="empty">' +
              'No verification requests found.' +
              '</div>';

            return;
          }


          renderRequests(result.requests);

        })

        .withFailureHandler(function(error) {

          container.innerHTML =
            '<div class="empty">' +
            'Unable to load verification requests.' +
            '</div>';

          console.error(error);

        })

        .getAllVerificationRequests();

    }


    function renderRequests(requests) {

      const container =
        document.getElementById("requestContainer");


      let html = `

        <table>

          <thead>

            <tr>

              <th>Request ID</th>
              <th>Student Name</th>
              <th>Roll No</th>
              <th>Mobile</th>
              <th>Exam ID</th>
              <th>Requested At</th>
              <th>Status</th>
              <th>Verification Code</th>
              <th>Action</th>

            </tr>

          </thead>

          <tbody id="requestTableBody">

      `;


      requests.forEach(function(request) {

        html += createRequestRow(request);

      });


      html += `

          </tbody>

        </table>

      `;


      container.innerHTML = html;

    }


    function createRequestRow(request) {

      const requestId =
        escapeHtml(request.requestId);

      const studentName =
        escapeHtml(request.studentName);

      const rollNo =
        escapeHtml(request.rollNo);

      const mobile =
        escapeHtml(request.mobile);

      const examId =
        escapeHtml(request.examId);

      const requestedAt =
        escapeHtml(request.requestedAt);

      const code =
        escapeHtml(request.verificationCode || "");

      let statusClass =
        "pending";


      if (request.status === "Approved") {

        statusClass = "approved";

      }

      if (request.status === "Rejected") {

        statusClass = "rejected";

      }


      let codeHtml =
        '<span style="color:#94a3b8;">Not Generated</span>';


      if (code) {

        codeHtml = `
          <span class="code">${code}</span>
          <button
            type="button"
            class="copy-btn"
            onclick="copyCode('${escapeJs(request.verificationCode)}')"
          >
            Copy
          </button>
        `;

      }


      let actionHtml = "";


      if (request.status === "Pending") {

        actionHtml = `

          <button
            type="button"
            class="approve-btn"
            onclick="approveRequest('${escapeJs(request.requestId)}')"
          >
            Approve
          </button>

          <button
            type="button"
            class="reject-btn"
            onclick="rejectRequest('${escapeJs(request.requestId)}')"
          >
            Reject
          </button>

          <button
            type="button"
            class="delete-btn"
            onclick="deleteRequest('${escapeJs(request.requestId)}')"
          >
            Delete
          </button>

        `;

      } else if (request.status === "Approved") {

        actionHtml = `



          <button
            type="button"
            class="regenerate-btn"
            onclick="regenerateCode('${escapeJs(request.requestId)}')"
          >
            Regenerate
          </button>

          <button
            type="button"
            class="delete-btn"
            onclick="deleteRequest('${escapeJs(request.requestId)}')"
          >
            Delete
          </button>

        `;

      } else {

        actionHtml = `

          <button
            type="button"
            class="delete-btn"
            onclick="deleteRequest('${escapeJs(request.requestId)}')"
          >
            Delete
          </button>

        `;

      }


      return `

        <tr id="row-${requestId}">

          <td>${requestId}</td>

          <td>${studentName}</td>

          <td>${rollNo}</td>

          <td>${mobile}</td>

          <td>${examId}</td>

          <td>${requestedAt}</td>

          <td>
            <span
              id="status-${requestId}"
              class="${statusClass}"
            >
              ${escapeHtml(request.status)}
            </span>
          </td>

          <td id="code-${requestId}">
            ${codeHtml}
          </td>

          <td id="actions-${requestId}">
            ${actionHtml}
          </td>

        </tr>

      `;

    }


    function approveRequest(requestId) {

      if (!confirm(
        "Approve this verification request?"
      )) {

        return;

      }


      const row =
        document.getElementById(
          "row-" + requestId
        );


      google.script.run

        .withSuccessHandler(function(result) {

          if (!result.success) {

            showMessage(
              result.message,
              "error"
            );

            return;

          }


          updateApprovedRow(
            requestId,
            result.code
          );


          showMessage(
            "Verification approved successfully.",
            "success"
          );

        })

        .withFailureHandler(function(error) {

          showMessage(
            "Unable to approve the request.",
            "error"
          );

          console.error(error);

        })

        .approveVerificationRequest(requestId);

    }


    function updateApprovedRow(
      requestId,
      code
    ) {

      const status =
        document.getElementById(
          "status-" + requestId
        );

      const codeCell =
        document.getElementById(
          "code-" + requestId
        );

      const actions =
        document.getElementById(
          "actions-" + requestId
        );


      if (status) {

        status.textContent =
          "Approved";

        status.className =
          "approved";

      }


      if (codeCell) {

        codeCell.innerHTML = `

          <span class="code">
            ${escapeHtml(code)}
          </span>

          <button
            type="button"
            class="copy-btn"
            onclick="copyCode('${escapeJs(code)}')"
          >
            Copy
          </button>

        `;

      }


      if (actions) {

        actions.innerHTML = `

          <button
            type="button"
            class="copy-btn"
            onclick="copyCode('${escapeJs(code)}')"
          >
            Copy
          </button>

          <button
            type="button"
            class="regenerate-btn"
            onclick="regenerateCode('${escapeJs(requestId)}')"
          >
            Regenerate
          </button>

          <button
            type="button"
            class="delete-btn"
            onclick="deleteRequest('${escapeJs(requestId)}')"
          >
            Delete
          </button>

        `;

      }

    }


    function rejectRequest(requestId) {

      if (!confirm(
        "Reject this verification request?"
      )) {

        return;

      }


      google.script.run

        .withSuccessHandler(function(result) {

          if (!result.success) {

            showMessage(
              result.message,
              "error"
            );

            return;

          }


          updateRejectedRow(
            requestId
          );


          showMessage(
            "Verification request rejected.",
            "success"
          );

        })

        .withFailureHandler(function(error) {

          showMessage(
            "Unable to reject the request.",
            "error"
          );

          console.error(error);

        })

        .rejectVerificationRequest(requestId);

    }


    function updateRejectedRow(requestId) {

      const status =
        document.getElementById(
          "status-" + requestId
        );

      const codeCell =
        document.getElementById(
          "code-" + requestId
        );

      const actions =
        document.getElementById(
          "actions-" + requestId
        );


      if (status) {

        status.textContent =
          "Rejected";

        status.className =
          "rejected";

      }


      if (codeCell) {

        codeCell.innerHTML =
          '<span style="color:#94a3b8;">Not Generated</span>';

      }


      if (actions) {

        actions.innerHTML = `

          <button
            type="button"
            class="delete-btn"
            onclick="deleteRequest('${escapeJs(requestId)}')"
          >
            Delete
          </button>

        `;

      }

    }


    function deleteRequest(requestId) {

      if (!confirm(
        "Delete this verification request permanently?"
      )) {

        return;

      }


      const row =
        document.getElementById(
          "row-" + requestId
        );


      if (row) {

        row.classList.add("removing");

      }


      google.script.run

        .withSuccessHandler(function(result) {

          if (!result.success) {

            if (row) {
              row.classList.remove("removing");
            }

            showMessage(
              result.message,
              "error"
            );

            return;

          }


          if (row) {

            row.remove();

          }


          checkEmptyTable();


          showMessage(
            "Verification request deleted.",
            "success"
          );

        })

        .withFailureHandler(function(error) {

          if (row) {
            row.classList.remove("removing");
          }

          showMessage(
            "Unable to delete the request.",
            "error"
          );

          console.error(error);

        })

        .deleteVerificationRequest(requestId);

    }


    function deleteAllRequests() {

      if (!confirm(
        "Delete ALL verification requests permanently?"
      )) {

        return;

      }


      google.script.run

        .withSuccessHandler(function(result) {

          if (!result.success) {

            showMessage(
              result.message,
              "error"
            );

            return;

          }


          const container =
            document.getElementById(
              "requestContainer"
            );


          container.innerHTML = `

            <div class="empty">
              All verification requests have been deleted.
            </div>

          `;


          showMessage(
            "All verification requests deleted.",
            "success"
          );

        })

        .withFailureHandler(function(error) {

          showMessage(
            "Unable to delete all requests.",
            "error"
          );

          console.error(error);

        })

        .deleteAllVerificationRequests();

    }


    function checkEmptyTable() {

      const tbody =
        document.getElementById(
          "requestTableBody"
        );


      if (
        tbody &&
        tbody.children.length === 0
      ) {

        document.getElementById(
          "requestContainer"
        ).innerHTML = `

          <div class="empty">
            No verification requests found.
          </div>

        `;

      }

    }


    function regenerateCode(requestId) {

      if (!confirm(
        "Generate a new verification code?"
      )) {

        return;

      }


      google.script.run

        .withSuccessHandler(function(result) {

          if (!result.success) {

            showMessage(
              result.message,
              "error"
            );

            return;

          }


          const codeCell =
            document.getElementById(
              "code-" + requestId
            );


          const actions =
            document.getElementById(
              "actions-" + requestId
            );


          if (codeCell) {

            codeCell.innerHTML = `

              <span class="code">
                ${escapeHtml(result.code)}
              </span>

              <button
                type="button"
                class="copy-btn"
                onclick="copyCode('${escapeJs(result.code)}')"
              >
                Copy
              </button>

            `;

          }


          if (actions) {

            actions.innerHTML = `

              <button
                type="button"
                class="copy-btn"
                onclick="copyCode('${escapeJs(result.code)}')"
              >
                Copy
              </button>

              <button
                type="button"
                class="regenerate-btn"
                onclick="regenerateCode('${escapeJs(requestId)}')"
              >
                Regenerate
              </button>

              <button
                type="button"
                class="delete-btn"
                onclick="deleteRequest('${escapeJs(requestId)}')"
              >
                Delete
              </button>

            `;

          }


          showMessage(
            "Verification code regenerated successfully.",
            "success"
          );

        })

        .withFailureHandler(function(error) {

          showMessage(
            "Unable to regenerate the verification code.",
            "error"
          );

          console.error(error);

        })

        .regenerateVerificationCode(requestId);

    }


    function copyCode(code) {

      if (!code) {

        showMessage(
          "Verification code is not available.",
          "error"
        );

        return;

      }


      if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {

        navigator.clipboard
          .writeText(code)
          .then(function() {

            showMessage(
              "Verification code copied.",
              "success"
            );

          })
          .catch(function() {

            fallbackCopy(code);

          });

      } else {

        fallbackCopy(code);

      }

    }


    function fallbackCopy(text) {

      const textarea =
        document.createElement("textarea");

      textarea.value = text;

      textarea.style.position =
        "fixed";

      textarea.style.left =
        "-9999px";

      document.body.appendChild(
        textarea
      );

      textarea.select();


      try {

        document.execCommand("copy");

        showMessage(
          "Verification code copied.",
          "success"
        );

      }

      catch (error) {

        showMessage(
          "Unable to copy the verification code.",
          "error"
        );

      }


      document.body.removeChild(
        textarea
      );

    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(value) {

      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, "\\r")
        .replace(/\n/g, "\\n");

    }


    loadRequests();

  </script>

</body>

</html>
