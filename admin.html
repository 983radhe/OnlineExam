<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vikas Online Exam - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  padding:20px;
  color:#111827;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

input{
  width:100%;
  padding:12px 13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  outline:none;
  font-size:14px;
  margin:7px 0 14px;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* LOGIN */

.admin-login{
  width:100%;
  max-width:430px;
  margin:70px auto;
  background:#fff;
  border-radius:16px;
  padding:30px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.login-logo{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0 auto 15px;
  font-size:28px;
  font-weight:bold;
}

.admin-login h1{
  text-align:center;
  font-size:24px;
  margin-bottom:6px;
}

.admin-login .subtitle{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-bottom:25px;
}

.admin-login label{
  display:block;
  font-size:13px;
  font-weight:bold;
  color:#374151;
}

.login-btn{
  width:100%;
  background:#1e3a8a;
  color:#fff;
  padding:13px;
}

.login-btn:hover{
  background:#1e40af;
}

/* MESSAGES */

.message{
  display:none;
  margin-top:14px;
  padding:11px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.message.show{
  display:block;
}

.message.success{
  background:#dcfce7;
  color:#166534;
}

.message.error{
  background:#fee2e2;
  color:#991b1b;
}

.message.warning{
  background:#fef3c7;
  color:#92400e;
}

/* APP */

#adminApp{
  display:none;
}

.container{
  width:100%;
  max-width:1400px;
  margin:auto;
}

.header{
  background:#1e3a8a;
  color:#fff;
  padding:22px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header h1{
  font-size:25px;
  margin-bottom:5px;
}

.header p{
  font-size:13px;
  opacity:.85;
}

.logout-btn{
  background:#dc2626;
  color:#fff;
}

.logout-btn:hover{
  background:#b91c1c;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.top-bar h2{
  font-size:19px;
  color:#111827;
}

.button-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.refresh-btn{
  background:#2563eb;
  color:#fff;
}

.refresh-btn:hover{
  background:#1d4ed8;
}

.delete-all-btn{
  background:#991b1b;
  color:#fff;
}

.delete-all-btn:hover{
  background:#7f1d1d;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:#e2e8f0;
  color:#334155;
  padding:12px;
  text-align:left;
  font-size:12px;
  white-space:nowrap;
}

td{
  padding:11px;
  border-bottom:1px solid #e5e7eb;
  color:#374151;
  font-size:12px;
  vertical-align:middle;
}

tr.removing{
  opacity:.4;
}

.pending,
.approved,
.rejected{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.approved{
  background:#dcfce7;
  color:#166534;
}

.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.code{
  font-size:16px;
  font-weight:bold;
  letter-spacing:2px;
  color:#111827;
}

.approve-btn{
  background:#16a34a;
  color:#fff;
  margin:2px;
}

.reject-btn{
  background:#dc2626;
  color:#fff;
  margin:2px;
}

.copy-btn{
  background:#475569;
  color:#fff;
  margin:2px;
}

.regenerate-btn{
  background:#f59e0b;
  color:#fff;
  margin:2px;
}

.delete-btn{
  background:#b91c1c;
  color:#fff;
  margin:2px;
}

/* CAMERA */

.camera-section{
  position:relative;
}

.camera-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.camera-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.camera-title h2{
  font-size:19px;
}

.camera-count{
  background:#eff6ff;
  color:#1d4ed8;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

/* CAMERA COLLAPSE */

.camera-body{
  margin-top:18px;
  overflow:hidden;
  max-height:5000px;
  transition:max-height .3s ease;
}

.camera-section.collapsed .camera-body{
  max-height:0;
  margin-top:0;
}

.camera-arrow{
  width:38px;
  height:38px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e2e8f0;
  color:#334155;
  font-size:18px;
}

.camera-arrow:hover{
  background:#cbd5e1;
}

.camera-section.collapsed .camera-arrow{
  transform:rotate(-90deg);
}

/* CAMERA GRID */

.camera-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:15px;
}

.camera-item{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:10px;
  background:#f8fafc;
}

.camera-item img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border-radius:9px;
  background:#0f172a;
  display:block;
}

.camera-meta{
  font-size:12px;
  color:#475569;
  line-height:1.6;
  margin-top:8px;
  word-break:break-word;
}

.camera-view-btn{
  display:inline-block;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  margin-top:7px;
  font-size:11px;
  font-weight:bold;
}

/* STATES */

.loading{
  text-align:center;
  padding:35px;
  color:#64748b;
}

.empty{
  text-align:center;
  padding:35px;
  color:#64748b;
}

.server-status{
  margin-top:10px;
  font-size:11px;
  color:#64748b;
}

/* RESPONSIVE */

@media(max-width:700px){

  body{
    padding:10px;
  }

  .admin-login{
    margin:30px auto;
    padding:20px;
  }

  .header{
    padding:17px;
  }

  .header-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .header h1{
    font-size:21px;
  }

  .card{
    padding:15px;
  }

  .camera-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<div id="adminLogin" class="admin-login">

  <div class="login-logo">V</div>

  <h1>Admin Login</h1>

  <div class="subtitle">
    Vikas Online Exam Administrator Panel
  </div>

  <form id="adminLoginForm">

    <label for="adminUsername">
      Username
    </label>

    <input
      id="adminUsername"
      type="text"
      autocomplete="username"
      placeholder="Enter admin username"
      required
    >

    <label for="adminPassword">
      Password
    </label>

    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Enter admin password"
      required
    >

    <button
      id="adminLoginBtn"
      class="login-btn"
      type="submit"
    >
      Login to Admin Panel
    </button>

  </form>

  <div
    id="loginMessage"
    class="message"
  ></div>

  <div class="server-status">
    Server-side authentication enabled
  </div>

</div>


<!-- =====================================================
     ADMIN APPLICATION
===================================================== -->

<div id="adminApp">

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="header-row">

      <div>
        <h1>Vikas Online Exam</h1>
        <p>Administrator Control Panel</p>
      </div>

      <button
        class="logout-btn"
        type="button"
        onclick="logoutAdmin()"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- ===================================================
       VERIFICATION REQUESTS
  ==================================================== -->

  <div class="card">

    <div class="top-bar">

      <h2>
        Verification Requests
      </h2>

      <div class="button-group">

        <button
          class="refresh-btn"
          type="button"
          onclick="loadRequests()"
        >
          Refresh
        </button>

        <button
          class="delete-all-btn"
          type="button"
          onclick="deleteAllRequests()"
        >
          Delete All
        </button>

      </div>

    </div>

    <div
      id="adminMessage"
      class="message"
    ></div>

    <div id="requestContainer">

      <div class="loading">
        Loading verification requests...
      </div>

    </div>

  </div>


  <!-- ===================================================
       CAMERA CAPTURES
  ==================================================== -->

  <div
    id="cameraSection"
    class="card camera-section"
  >

    <div class="camera-header">

      <div class="camera-title">

        <button
          id="cameraArrow"
          class="camera-arrow"
          type="button"
          onclick="toggleCameraSection()"
          title="Minimize Camera Logs"
        >
          ▼
        </button>

        <h2>
          Camera Captures
        </h2>

        <span
          id="cameraCount"
          class="camera-count"
        >
          0 Photos
        </span>

      </div>

      <button
        class="refresh-btn"
        type="button"
        onclick="loadCameraCaptures()"
      >
        Refresh
      </button>

    </div>

    <div
      id="cameraBody"
      class="camera-body"
    >

      <div id="cameraContainer">

        <div class="loading">
          Loading camera captures...
        </div>

      </div>

    </div>

  </div>

</div>

</div>


<script>
"use strict";

/* =====================================================
   GLOBAL ADMIN STATE
===================================================== */

let adminToken =
  sessionStorage.getItem("VOE_ADMIN_TOKEN") || "";

let loginBusy = false;


/* =====================================================
   ELEMENT HELPERS
===================================================== */

function $(id){
  return document.getElementById(id);
}


/* =====================================================
   MESSAGE
===================================================== */

function showLoginMessage(text,type){

  const box = $("loginMessage");

  if(!box) return;

  box.textContent = text || "";

  box.className =
    "message show " +
    (type || "error");
}


function showAdminMessage(text,type){

  const box = $("adminMessage");

  if(!box) return;

  box.textContent = text || "";

  box.className =
    "message show " +
    (type || "success");

  setTimeout(function(){

    box.className = "message";

  },4000);
}


/* =====================================================
   SHOW / HIDE ADMIN
===================================================== */

function showAdminApp(){

  $("adminLogin").style.display = "none";

  $("adminApp").style.display = "block";

  loadRequests();

  loadCameraCaptures();
}


function showLogin(){

  $("adminApp").style.display = "none";

  $("adminLogin").style.display = "block";

}


/* =====================================================
   LOGIN
===================================================== */

$("adminLoginForm").addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    if(loginBusy) return;

    const username =
      $("adminUsername").value.trim();

    const password =
      $("adminPassword").value;

    if(!username || !password){

      showLoginMessage(
        "Please enter username and password.",
        "error"
      );

      return;
    }

    loginBusy = true;

    const btn =
      $("adminLoginBtn");

    btn.disabled = true;

    btn.textContent = "Signing in...";

    $("loginMessage").className =
      "message";

    google.script.run

      .withSuccessHandler(function(result){

        loginBusy = false;

        btn.disabled = false;

        btn.textContent =
          "Login to Admin Panel";

        if(
          !result ||
          !result.success ||
          !result.token
        ){

          showLoginMessage(
            result && result.message
              ? result.message
              : "Invalid admin username or password.",
            "error"
          );

          return;
        }

        adminToken =
          String(result.token);

        sessionStorage.setItem(
          "VOE_ADMIN_TOKEN",
          adminToken
        );

        $("adminPassword").value = "";

        showAdminApp();

      })

      .withFailureHandler(function(error){

        loginBusy = false;

        btn.disabled = false;

        btn.textContent =
          "Login to Admin Panel";

        showLoginMessage(
          "Unable to connect to the server. Please try again.",
          "error"
        );

        console.error(
          "Admin login error:",
          error
        );

      })

      .adminLogin(
        username,
        password
      );

  }
);


/* =====================================================
   LOGOUT
===================================================== */

function logoutAdmin(){

  const token =
    adminToken;

  sessionStorage.removeItem(
    "VOE_ADMIN_TOKEN"
  );

  adminToken = "";

  google.script.run

    .withSuccessHandler(function(){

      resetAdminLogin();

    })

    .withFailureHandler(function(){

      resetAdminLogin();

    })

    .adminLogout(token);
}


function resetAdminLogin(){

  $("adminApp").style.display = "none";

  $("adminLogin").style.display = "block";

  $("adminUsername").value = "";

  $("adminPassword").value = "";

  $("loginMessage").className =
    "message";
}


/* =====================================================
   SESSION EXPIRED
===================================================== */

function sessionExpired(){

  sessionStorage.removeItem(
    "VOE_ADMIN_TOKEN"
  );

  adminToken = "";

  resetAdminLogin();

  showLoginMessage(
    "Admin session expired. Please login again.",
    "error"
  );
}


/* =====================================================
   REQUESTS
===================================================== */

function loadRequests(){

  if(!adminToken){

    sessionExpired();

    return;
  }

  const container =
    $("requestContainer");

  container.innerHTML =
    '<div class="loading">Loading verification requests...</div>';

  google.script.run

    .withSuccessHandler(function(result){

      if(!result || !result.success){

        if(
          result &&
          result.message ===
          "ADMIN_AUTH_REQUIRED"
        ){

          sessionExpired();

          return;
        }

        container.innerHTML =
          '<div class="empty">' +
          escapeHtml(
            result && result.message
              ? result.message
              : "Unable to load requests."
          ) +
          '</div>';

        return;
      }

      if(
        !result.requests ||
        result.requests.length === 0
      ){

        container.innerHTML =
          '<div class="empty">' +
          'No verification requests found.' +
          '</div>';

        return;
      }

      renderRequests(
        result.requests
      );

    })

    .withFailureHandler(function(error){

      container.innerHTML =
        '<div class="empty">' +
        'Unable to load verification requests.' +
        '</div>';

      console.error(
        "Request loading error:",
        error
      );

    })

    .getAllVerificationRequests(
      adminToken
    );
}


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests(requests){

  let html = '';

  html += '<div class="table-wrap">';

  html += '<table>';

  html += `
    <thead>
      <tr>
        <th>Request ID</th>
        <th>Student Name</th>
        <th>Roll No</th>
        <th>Mobile</th>
        <th>Exam ID</th>
        <th>Requested At</th>
        <th>Status</th>
        <th>Verification Code</th>
        <th>Action</th>
      </tr>
    </thead>
  `;

  html += '<tbody>';

  requests.forEach(function(request){

    html += createRequestRow(
      request
    );

  });

  html += '</tbody>';

  html += '</table>';

  html += '</div>';

  $("requestContainer").innerHTML =
    html;
}


/* =====================================================
   CREATE REQUEST ROW
===================================================== */

function createRequestRow(request){

  const id =
    String(request.requestId || "");

  const status =
    String(request.status || "Pending");

  let statusClass =
    "pending";

  if(status === "Approved"){
    statusClass = "approved";
  }

  if(status === "Rejected"){
    statusClass = "rejected";
  }

  let codeHtml =
    '<span style="color:#94a3b8;">Not Generated</span>';

  if(request.verificationCode){

    const code =
      String(request.verificationCode);

    codeHtml = `
      <span class="code">
        ${escapeHtml(code)}
      </span>

      <button
        class="copy-btn"
        type="button"
        onclick="copyCode('${escapeJs(code)}')"
      >
        Copy
      </button>
    `;
  }

  let actions = "";

  if(status === "Pending"){

    actions = `

      <button
        class="approve-btn"
        type="button"
        onclick="approveRequest('${escapeJs(id)}')"
      >
        Approve
      </button>

      <button
        class="reject-btn"
        type="button"
        onclick="rejectRequest('${escapeJs(id)}')"
      >
        Reject
      </button>

      <button
        class="delete-btn"
        type="button"
        onclick="deleteRequest('${escapeJs(id)}')"
      >
        Delete
      </button>

    `;

  }
  else if(status === "Approved"){

    actions = `

      <button
        class="regenerate-btn"
        type="button"
        onclick="regenerateCode('${escapeJs(id)}')"
      >
        Regenerate
      </button>

      <button
        class="delete-btn"
        type="button"
        onclick="deleteRequest('${escapeJs(id)}')"
      >
        Delete
      </button>

    `;

  }
  else{

    actions = `

      <button
        class="delete-btn"
        type="button"
        onclick="deleteRequest('${escapeJs(id)}')"
      >
        Delete
      </button>

    `;
  }

  return `

    <tr id="row-${escapeHtml(id)}">

      <td>
        ${escapeHtml(id)}
      </td>

      <td>
        ${escapeHtml(request.studentName)}
      </td>

      <td>
        ${escapeHtml(request.rollNo)}
      </td>

      <td>
        ${escapeHtml(request.mobile)}
      </td>

      <td>
        ${escapeHtml(request.examId)}
      </td>

      <td>
        ${escapeHtml(request.requestedAt)}
      </td>

      <td>
        <span
          id="status-${escapeHtml(id)}"
          class="${statusClass}"
        >
          ${escapeHtml(status)}
        </span>
      </td>

      <td id="code-${escapeHtml(id)}">
        ${codeHtml}
      </td>

      <td id="actions-${escapeHtml(id)}">
        ${actions}
      </td>

    </tr>
  `;
}


/* =====================================================
   APPROVE
===================================================== */

function approveRequest(requestId){

  if(!confirm(
    "Approve this verification request?"
  )){
    return;
  }

  google.script.run

    .withSuccessHandler(function(result){

      if(!result || !result.success){

        if(
          result &&
          result.message ===
          "ADMIN_AUTH_REQUIRED"
        ){

          sessionExpired();

          return;
        }

        showAdminMessage(
          result && result.message
            ? result.message
            : "Unable to approve request.",
          "error"
        );

        return;
      }

      updateApprovedRow(
        requestId,
        result.code
      );

      showAdminMessage(
        "Verification approved successfully.",
        "success"
      );

    })

    .withFailureHandler(function(error){

      showAdminMessage(
        "Unable to approve the request.",
        "error"
      );

      console.error(error);

    })

    .approveVerificationRequest(
      requestId,
      adminToken
    );
}


/* =====================================================
   APPROVED ROW
===================================================== */

function updateApprovedRow(
  requestId,
  code
){

  const status =
    $("status-" + requestId);

  const codeCell =
    $("code-" + requestId);

  const actions =
    $("actions-" + requestId);

  if(status){

    status.textContent =
      "Approved";

    status.className =
      "approved";
  }

  if(codeCell){

    codeCell.innerHTML = `

      <span class="code">
        ${escapeHtml(code)}
      </span>

      <button
        class="copy-btn"
        type="button"
        onclick="copyCode('${escapeJs(code)}')"
      >
        Copy
      </button>

    `;
  }

  if(actions){

    actions.innerHTML = `

      <button
        class="regenerate-btn"
        type="button"
        onclick="regenerateCode('${escapeJs(requestId)}')"
      >
        Regenerate
      </button>

      <button
        class="delete-btn"
        type="button"
        onclick="deleteRequest('${escapeJs(requestId)}')"
      >
        Delete
      </button>

    `;
  }
}


/* =====================================================
   REJECT
===================================================== */

function rejectRequest(requestId){

  if(!confirm(
    "Reject this verification request?"
  )){
    return;
  }

  google.script.run

    .withSuccessHandler(function(result){

      if(!result || !result.success){

        if(
          result &&
          result.message ===
          "ADMIN_AUTH_REQUIRED"
        ){

          sessionExpired();

          return;
        }

        showAdminMessage(
          result && result.message
            ? result.message
            : "Unable to reject request.",
          "error"
        );

        return;
      }

      updateRejectedRow(
        requestId
      );

      showAdminMessage(
        "Verification request rejected.",
        "success"
      );

    })

    .withFailureHandler(function(error){

      showAdminMessage(
        "Unable to reject the request.",
        "error"
      );

      "rejected";
  }

    actions.innerHTML = `

      <button
        class="delete-btn"

      >
        Delete
      </button>

}


/* =====================================================
   DELETE REQUEST
===================================================== */

function deleteRequest(requestId){

  if(!confirm(
    "Delete this verification request permanently?"
  )){
    return;
  }

  const row =
    $("row-" + requestId);

  if(row){
    row.classList.add("removing");
  }

  google.script.run

    .withSuccessHandler(function(result){

      if(!result || !result.success){

        if(
          result &&
          result.message ===
          "ADMIN_AUTH_REQUIRED"
        ){

          sessionExpired();

          return;
        }

        if(row){
          row.classList.remove("removing");
        }

        showAdminMessage(
          result && result.message
            ? result.message
            : "Unable to delete request.",
          "error"
        );

        return;
      }

      if(row){
        row.remove();
      }

      showAdminMessage(
        "Verification request deleted.",
        "success"
      );

      checkEmptyTable();

    })

    .withFailureHandler(function(error){

      if(row){
        row.classList.remove("removing");
      }

      showAdminMessage(
        "Unable to delete the request.",
        "error"
      );

      console.error(error);

    })

    .deleteVerificationRequest(
      requestId,
      adminToken
    );
}

/* =====================================================
   COPY CODE
===================================================== */

function copyCode(code){

  code =
    String(code || "");

  if(!code){

    showAdminMessage(
      "Verification code is not available.",
      "error"
    );

    return;
  }

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(code)

      .then(function(){

        showAdminMessage(
          "Verification code copied.",
          "success"
        );

      })

      .catch(function(){

        fallbackCopy(code);

      });

  }
  else{

    fallbackCopy(code);

  }
}


function fallbackCopy(text){

  const textarea =
    document.createElement("textarea");

  textarea.value =
    text;

  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";

  textarea.style.top =
    "-9999px";

  document.body.appendChild(
    textarea
  );

  textarea.focus();

  textarea.select();

  try{

    const ok =
      document.execCommand("copy");

    if(ok){

      showAdminMessage(
        "Verification code copied.",
        "success"
      );

    }
    else{

      showAdminMessage(
        "Unable to copy verification code.",
        "error"
      );

    }

  }
  catch(error){

    showAdminMessage(
      "Unable to copy verification code.",
      "error"
    );

  }

  document.body.removeChild(
    textarea
  );
}

/* =====================================================
   CAMERA CAPTURES
===================================================== */

function loadCameraCaptures(){

  if(!adminToken){

    sessionExpired();

    return;
  }

  const container =
    $("cameraContainer");

  if(!container) return;

  container.innerHTML =
    '<div class="loading">Loading camera captures...</div>';

  google.script.run

    .withSuccessHandler(function(result){

      if(!result || !result.success){

        if(
          result &&
          result.message ===
          "ADMIN_AUTH_REQUIRED"
        ){

          sessionExpired();

          return;
        }

        container.innerHTML =
          '<div class="empty">' +
          escapeHtml(
            result && result.message
              ? result.message
              : "Unable to load camera captures."
          ) +
          '</div>';

        $("cameraCount").textContent =
          "0 Photos";

        return;
      }

      const captures =
        result.captures || [];

      $("cameraCount").textContent =
        captures.length +
        (
          captures.length === 1
            ? " Photo"
            : " Photos"
        );

      if(!captures.length){

        container.innerHTML =
          '<div class="empty">' +
          'No camera captures found.' +
          '</div>';

        return;
      }

      let html =
        '<div class="camera-grid">';

      captures.forEach(function(item){

        const imageUrl =
          String(item.imageUrl || "");

        html += `

          <div class="camera-item">

            <img
              src="${escapeHtml(imageUrl)}"
              alt="Student camera capture"
              loading="lazy"
              onerror="this.style.display='none';"
            >

            <div class="camera-meta">

              <b>Student:</b>
              ${escapeHtml(item.studentName || "-")}
              <br>

              <b>Roll:</b>
              ${escapeHtml(item.rollNo || "-")}
              <br>

              <b>Attempt:</b>
              ${escapeHtml(item.attemptId || "-")}
              <br>

              <b>Time:</b>
              ${escapeHtml(item.captureTime || "-")}

              ${
                imageUrl
                  ? `
                    <br>
                    <a
                      class="camera-view-btn"
                      href="${escapeHtml(imageUrl)}"
                      target="_blank"
                      rel="noopener"
                    >
                      View
                    </a>
                  `
                  : ""
              }

            </div>

          </div>

        `;

      });

      html +=
        '</div>';

      container.innerHTML =
        html;

    })

    .withFailureHandler(function(error){

      container.innerHTML =
        '<div class="empty">' +
        'Unable to load camera captures.' +
        '</div>';

      console.error(
        "Camera capture error:",
        error
      );

    })

    .getCameraCaptures(
      adminToken
    );
}

/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value === undefined ||
    value === null
      ? ""
      : value
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =====================================================
   JAVASCRIPT STRING ESCAPE
===================================================== */

function escapeJs(value){

  return String(
    value === undefined ||
    value === null
      ? ""
      : value
  )

  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'")
  .replace(/\r/g,"\\r")
  .replace(/\n/g,"\\n");
}


/* =====================================================
   EXISTING SESSION CHECK
===================================================== */

function checkExistingSession(){

  if(!adminToken){

    showLogin();

    return;
  }

  google.script.run

    .withSuccessHandler(function(result){

      if(
        result &&
        result.success === true
      ){

        showAdminApp();

      }
      else{

        sessionStorage.removeItem(
          "VOE_ADMIN_TOKEN"
        );

        adminToken = "";

        showLogin();

      }

    })

    .withFailureHandler(function(error){

      sessionStorage.removeItem(
        "VOE_ADMIN_TOKEN"
      );

      adminToken = "";

      showLogin();

      console.error(
        "Session validation error:",
        error
      );

    })

    .validateAdminSession(
      adminToken
    );
}
